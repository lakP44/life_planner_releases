name: Publish Life Planner

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag
        required: true
        type: string

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download the released web app
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern life-planner-web.zip --dir "$RUNNER_TEMP" -- "$RELEASE_TAG"
          unzip -q "$RUNNER_TEMP/life-planner-web.zip" -d "$RUNNER_TEMP/life-planner-site"
          test -f "$RUNNER_TEMP/life-planner-site/index.html"

      - name: Upload the website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/life-planner-site

  deploy:
    runs-on: ubuntu-latest
    needs: package
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
